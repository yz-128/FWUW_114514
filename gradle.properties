# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
#
# The UTF-8 settings are required, not cosmetic: this project lives under a path containing
# Chinese characters (`FLAN 移植i`), and ModDevGradle hands each run its arguments through a
# file, passed to the child JVM as `@<path>`.  A launcher whose `sun.jnu.encoding` is the
# Windows ANSI codepage mis-decodes that path and reports
#     could not open `...\FLAN ??ֲi\...\clientRunVmArgs.txt'
# even though the file is right there.  Pinning the encoding at startup keeps it intact.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# 21.1.250 is fully cached locally on this machine, so the first build does not
# have to download and decompile a fresh NeoForge artifact set.
neo_version=21.1.250
loader_version_range=[4,)

## Mod Properties

mod_id=flansmod
mod_name=Flan's Mod (Unofficial 1.21.1 Port)
# The 1.7.10 and 1.12.2 Flan's Mod releases, the Flan's Mod Ultimate branch and this port's
# 1.20.1 base all descend from a CC BY-NC-SA 3.0 work, and this port transcribes their code
# (see the "Transcribed from FMUM's ..." comments). ShareAlike therefore reaches this port:
# it must carry the same licence, not the MIT one the template started with.
mod_license=CC-BY-NC-SA-3.0
mod_version=0.4.0
mod_group_id=com.flansmod
mod_authors=Flan (original author); jamioflan and the Flan's Mod Ultimate branch (1.7.10 continuation); this port's contributors
mod_credits=Based on Flan's Mod by Flan. Code and behaviour transcribed from Flan's Mod Ultimate (FMUM) and Flan's Mod Ultimate 2.0. Not an official Flan's Mod release.

## Dependencies
